<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayHub - Reserva de Hoteles</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header / Hero -->
  <header class="hero">
    <nav class="navbar">
      <div class="logo">🏨 Stay<span>Hub</span></div>
      <div class="nav-links">
        <a href="#hoteles">Hoteles</a>
        <a href="#destinos">Destinos</a>
        <a href="#contacto">Contacto</a>
      </div>
    </nav>
    <div class="hero-content">
      <h1>Encuentra tu hotel ideal al mejor precio</h1>
      <p>Descubre alojamientos únicos, resorts de lujo y escapadas con encanto</p>
      
      <!-- Buscador y Filtros -->
      <div class="search-bar">
        <div class="input-group">
          <label for="search-input">Destino o Hotel</label>
          <input type="text" id="search-input" placeholder="Ej. Madrid, Barcelona, Pirineos...">
        </div>
        <div class="input-group">
          <label for="rating-filter">Calificación mínima</label>
          <select id="rating-filter">
            <option value="0">Todas las estrellas</option>
            <option value="3">⭐⭐⭐ o más</option>
            <option value="4">⭐⭐⭐⭐ o más</option>
            <option value="5">⭐⭐⭐⭐⭐ Lujo</option>
          </select>
        </div>
        <div class="input-group">
          <label for="price-filter">Precio máx. (<span id="price-val">300</span>€)</label>
          <input type="range" id="price-filter" min="50" max="500" step="10" value="300">
        </div>
        <button id="search-btn" class="btn btn-primary">Buscar</button>
      </div>
    </div>
  </header>

  <!-- Lista de Hoteles -->
  <main class="container" id="hoteles">
    <div class="section-header">
      <h2>Hoteles destacados</h2>
      <p id="results-count">Mostrando alojamientos disponibles</p>
    </div>

    <div class="hotel-grid" id="hotel-grid">
      <!-- Tarjetas generadas dinámicamente con JS -->
    </div>
  </main>

  <!-- Modal de Reserva -->
  <div id="booking-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="close-modal">&times;</span>
      <h3 id="modal-hotel-title">Reservar Hotel</h3>
      <p id="modal-hotel-city" class="modal-subtitle"></p>
      <div class="modal-body">
        <img id="modal-hotel-img" src="" alt="Hotel" class="modal-img">
        <p class="modal-price">Precio: <strong id="modal-hotel-price"></strong> por noche</p>
        <form id="booking-form">
          <div class="form-group">
            <label for="guest-name">Nombre y Apellidos</label>
            <input type="text" id="guest-name" required placeholder="Tu nombre">
          </div>
          <div class="form-group">
            <label for="guest-email">Correo Electrónico</label>
            <input type="email" id="guest-email" required placeholder="ejemplo@correo.com">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="check-in">Check-in</label>
              <input type="date" id="check-in" required>
            </div>
            <div class="form-group">
              <label for="check-out">Check-out</label>
              <input type="date" id="check-out" required>
            </div>
          </div>
          <button type="submit" class="btn btn-success full-width">Confirmar Reserva</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer id="contacto">
    <div class="container footer-content">
      <p>&copy; 2026 StayHub. Alojado en AWS S3 con Terraform.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
